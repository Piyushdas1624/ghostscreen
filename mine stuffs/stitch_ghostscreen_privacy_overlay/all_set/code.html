<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom animations for expressive feel */
        @keyframes blobBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .blob-anim {
            animation: blobBounce 4s infinite ease-in-out;
        }
        .glow-anim {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background dark:bg-background text-on-background dark:text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container relative overflow-x-hidden">
<!-- TopAppBar (Transactional - Hidden Navigation, just branding/back if needed, but this is step 3 so maybe just logo) -->
<header class="flex items-center justify-center px-margin-mobile h-16 w-full fixed top-0 z-50 bg-background dark:bg-background flat no shadows">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">
            GhostScreen
        </div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile md:px-margin-desktop pt-20 pb-safe md:pb-8 relative z-10 max-w-2xl mx-auto w-full">
<!-- Expressive Hero Graphic Area -->
<div class="w-full flex justify-center items-center mb-12 relative h-64 md:h-80">
<!-- Background Glow Effects -->
<div class="absolute inset-0 flex justify-center items-center opacity-50 glow-anim">
<div class="w-48 h-48 md:w-64 md:h-64 rounded-full bg-primary-container dark:bg-primary-container blur-3xl mix-blend-screen"></div>
<div class="w-32 h-32 md:w-48 md:h-48 rounded-full bg-tertiary-container dark:bg-tertiary-container blur-2xl absolute -bottom-4 mix-blend-screen"></div>
</div>
<!-- Central Icon/Mascot -->
<div class="relative z-10 w-32 h-32 md:w-40 md:h-40 rounded-full bg-surface-container-high dark:bg-surface-container-highest flex items-center justify-center shadow-lg blob-anim ring-4 ring-background dark:ring-background">
<span class="material-symbols-outlined text-6xl md:text-7xl text-primary dark:text-primary-fixed-dim" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Typography Section -->
<div class="text-center mb-10 flex flex-col gap-4">
<h1 class="font-display-lg text-display-lg text-on-surface dark:text-on-surface tracking-tight">You're all set!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant dark:text-on-surface-variant max-w-md mx-auto">
                Tap the activate button on the home screen to start your first mask.
            </p>
</div>
<!-- Bento Grid / Cards for Tips -->
<div class="grid grid-cols-1 gap-base mb-12">
<!-- Quick Settings Tip Card -->
<div class="bg-surface-container-low dark:bg-surface-container-low rounded-xl p-6 flex items-start gap-4 transition-transform duration-300 hover:-translate-y-1">
<div class="w-12 h-12 rounded-full bg-secondary-container dark:bg-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary-container dark:text-on-secondary-container" data-icon="settings_applications">settings_applications</span>
</div>
<div class="flex flex-col gap-1">
<h3 class="font-title-lg text-title-lg text-on-surface dark:text-on-surface">Pro Tip: Quick Settings</h3>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-on-surface-variant">
                        Add the GhostScreen tile to your device's Quick Settings panel for instant masking without opening the app.
                    </p>
</div>
</div>
</div>
<!-- Bottom Action Area -->
<div class="mt-auto md:mt-0 flex flex-col gap-4">
<!-- Big Expressive Button -->
<button class="w-full h-14 md:h-16 rounded-full bg-primary dark:bg-primary text-on-primary dark:text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-tint active:scale-95 transition-all duration-300 ease-out shadow-md group">
<span class="font-bold text-lg tracking-wide">Finish</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform duration-200" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- Suppressed BottomNavBar & Nav Shell because this is a transactional Onboarding Step -->
