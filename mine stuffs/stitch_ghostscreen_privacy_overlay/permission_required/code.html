<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GhostScreen - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#cbc4d2",
                    "surface-variant": "#e5e1e7",
                    "surface-container-highest": "#e5e1e7",
                    "on-tertiary-fixed-variant": "#633b48",
                    "primary": "#4f378a",
                    "on-tertiary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#ebe7ec",
                    "on-primary": "#ffffff",
                    "on-secondary-container": "#686177",
                    "primary-fixed-dim": "#cfbcff",
                    "on-secondary-fixed-variant": "#4a4358",
                    "on-secondary-fixed": "#1e192b",
                    "on-background": "#1c1b1f",
                    "on-surface": "#1c1b1f",
                    "surface-container-low": "#f7f2f8",
                    "on-secondary": "#ffffff",
                    "surface-container": "#f1ecf2",
                    "on-primary-fixed": "#22005d",
                    "background": "#fdf8fd",
                    "tertiary": "#633b48",
                    "on-tertiary-container": "#ffcbda",
                    "inverse-on-surface": "#f4eff5",
                    "secondary": "#625b71",
                    "primary-container": "#6750a4",
                    "on-surface-variant": "#494551",
                    "secondary-fixed": "#e8def9",
                    "error-container": "#ffdad6",
                    "inverse-surface": "#313034",
                    "secondary-container": "#e8def9",
                    "tertiary-container": "#7d5260",
                    "tertiary-fixed": "#ffd9e3",
                    "on-tertiary-fixed": "#31111d",
                    "surface-bright": "#fdf8fd",
                    "outline": "#7a7582",
                    "surface-tint": "#6750a4",
                    "tertiary-fixed-dim": "#eeb8c8",
                    "surface-dim": "#ddd9de",
                    "on-primary-fixed-variant": "#4f378a",
                    "error": "#ba1a1a",
                    "secondary-fixed-dim": "#ccc2dc",
                    "on-primary-container": "#e0d2ff",
                    "inverse-primary": "#cfbcff",
                    "on-error": "#ffffff",
                    "surface": "#fdf8fd",
                    "primary-fixed": "#e9ddff",
                    "surface-container-lowest": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "pill-padding-x": "24px",
                    "margin-desktop": "24px",
                    "base": "8px",
                    "gutter": "16px",
                    "pill-padding-y": "16px",
                    "safe": "env(safe-area-inset-bottom)"
            },
            "fontFamily": {
                    "body-lg": ["Roboto Flex", "sans-serif"],
                    "label-md": ["Roboto Flex", "sans-serif"],
                    "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
                    "title-lg": ["Plus Jakarta Sans", "sans-serif"],
                    "headline-lg-mobile": ["Plus Jakarta Sans", "sans-serif"],
                    "label-lg": ["Roboto Flex", "sans-serif"],
                    "display-lg": ["Plus Jakarta Sans", "sans-serif"],
                    "body-md": ["Roboto Flex", "sans-serif"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        /* Base styles to support dark mode inversion mapping manually if CSS variables aren't injected */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Expressive toggle pulse animation */
        @keyframes subtle-pulse {
            0% { box-shadow: 0 0 0 0 rgba(103, 80, 164, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(103, 80, 164, 0); }
            100% { box-shadow: 0 0 0 0 rgba(103, 80, 164, 0); }
        }
        .animate-toggle-pulse {
            animation: subtle-pulse 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col font-body-lg selection:bg-primary-container selection:text-on-primary-container">
<!-- Step Progress Indicator -->
<header class="w-full flex justify-center gap-base pt-12 px-margin-mobile">
<div class="h-2 w-8 bg-surface-variant rounded-full transition-all duration-300"></div>
<div class="h-2 w-16 bg-primary rounded-full transition-all duration-300"></div>
<div class="h-2 w-8 bg-surface-variant rounded-full transition-all duration-300"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-md mx-auto px-margin-mobile md:px-margin-desktop py-8">
<!-- Expressive Mockup Card -->
<div class="relative w-full aspect-square max-h-[340px] bg-surface-container-low rounded-[3rem] flex flex-col items-center justify-center overflow-hidden mb-10 border border-outline-variant/30 shadow-sm transition-transform duration-500 hover:scale-[1.02]">
<!-- Abstract background gradient -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-colors-primary-fixed-dim)_0%,_transparent_60%)] opacity-30 mix-blend-multiply"></div>
<!-- Android Settings Mockup -->
<div class="relative z-10 w-[85%] bg-surface rounded-xl p-5 flex flex-col gap-6 shadow-md border border-surface-variant/50">
<!-- Mockup Header -->
<div class="flex items-center gap-3 border-b border-surface-variant pb-4">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span class="font-title-lg text-title-lg text-on-surface">Display over other apps</span>
</div>
<!-- Mockup App Row -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">layers</span>
</div>
<div class="flex flex-col">
<span class="font-title-lg text-title-lg text-on-surface text-base leading-tight">GhostScreen</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Not allowed</span>
</div>
</div>
<!-- Expressive Toggle Switch -->
<div class="relative flex items-center justify-end w-14 h-8 bg-surface-variant rounded-full p-1 cursor-pointer animate-toggle-pulse">
<div class="w-6 h-6 bg-outline rounded-full shadow-sm transition-all duration-300 transform translate-x-0"></div>
<!-- Hint overlay for interaction -->
<div class="absolute inset-0 bg-primary opacity-0 rounded-full transition-opacity duration-300"></div>
</div>
</div>
</div>
</div>
<!-- Typography & Explanation -->
<div class="text-center flex flex-col items-center gap-4 mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-on-background tracking-tight">
                Permission Guide
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px]">
                To draw the mask over your screen, we need one special permission.
            </p>
</div>
</main>
<!-- Pinned Bottom Actions -->
<footer class="w-full max-w-md mx-auto px-margin-mobile md:px-margin-desktop pb-8 pb-safe flex flex-col gap-4">
<!-- Large Pill-Shaped Primary Button -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 scale-100 active:scale-95 transition-all duration-200 shadow-md hover:bg-primary/90 hover:shadow-lg">
<span>Grant Permission</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Secondary Text Link -->
<button class="w-full h-[48px] text-primary bg-transparent rounded-full font-label-lg text-label-lg flex items-center justify-center hover:bg-primary/10 transition-colors duration-200 active:bg-primary/20">
            Why is this needed?
        </button>
</footer>
<script>
        // Micro-interaction for the mockup toggle demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const toggleContainer = document.querySelector('.animate-toggle-pulse');
            const toggleThumb = toggleContainer.querySelector('div.bg-outline');
            const toggleLabel = document.querySelector('.text-on-surface-variant.text-sm');
            
            // Auto-demonstrate the toggle action after a delay
            setTimeout(() => {
                toggleContainer.classList.remove('bg-surface-variant');
                toggleContainer.classList.add('bg-primary');
                
                toggleThumb.classList.remove('bg-outline', 'translate-x-0');
                toggleThumb.classList.add('bg-on-primary', 'translate-x-6');
                
                toggleLabel.textContent = "Allowed";
                toggleLabel.classList.add('text-primary');
                
                // Stop pulse once "activated"
                toggleContainer.classList.remove('animate-toggle-pulse');
            }, 1500);
        });
    </script>
</body></html>
