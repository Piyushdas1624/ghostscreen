name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0-b3)"
        required: true

jobs:
  build-release:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'
          components: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmdline-tools;latest

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Decode Release Keystore (if secret provided)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/release.keystore

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ${{ env.KEYSTORE_BASE64 != '' && '~/.android/release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Generate SHA-256 Checksums
        id: checksum
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "${f}.sha256"
            echo "Generated checksum for $f"
          done

      - name: Archive R8 Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GhostScreen Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/mapping/release/mapping.txt
